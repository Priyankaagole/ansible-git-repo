---
- name: Configure development web content
  hosts: dev
  become: true

  tasks:
    - name: Ensure webdev group exists
      ansible.builtin.group:
        name: webdev
        state: present

    - name: Create Apache web content directory
      ansible.builtin.file:
        path: /var/www/html/webdev
        state: directory
        owner: root
        group: webdev
        mode: "2775"

    - name: Create web development index packages
      ansible.builtin.copy:
        content: "Development"
        dest: /var/www/html/webdev/index.html
        owner: root
        group: webdev
        mode: "0644"

    - name: Create a symlink at /webdev
      ansible.builtin.file:
        src: /var/www/html/webdev
        dest: /webdev
        state: link